<style>
/* Layout: barra superior con el proyecto, módulos a la izquierda, área de trabajo al centro, parámetros a la derecha */
:root{
  --bg:#1c1f22; --panel:#24282c; --panel2:#2c3136; --line:#394047; --fg:#e3e6e2; --mute:#9aa2a7; --dim:#6b747a;
  --acc:#f0962e; --acc-ink:#24160a; --sub:#55bfd8; --sum:#eef0ea; --ok:#62c172; --warn:#e6b23c; --bad:#e2563f;
  --ui:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:170px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "nav work props";gap:0 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 14px}
.top{grid-area:top;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--ui);letter-spacing:.01em;white-space:nowrap}
.brand svg{flex:none}
.pname{flex:1 1 220px;min-width:0;max-width:420px;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;font:500 16px var(--ui);color:var(--mute)}
.pname:hover,.pname:focus{border-color:var(--line);color:var(--fg)}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{font:600 14px/1 var(--ui);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;color:var(--fg)}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.side{grid-area:nav;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.side h2{font:600 12px var(--ui);color:var(--dim);margin:14px 10px 4px;letter-spacing:.03em}
.side h2:first-child{margin-top:0}
.side button{text-align:left;background:transparent;border:0;border-radius:6px;padding:8px 10px;font:500 15px/1.2 var(--ui);color:var(--mute);cursor:pointer}
.side button:hover{color:var(--fg);background:var(--panel)}
.side button.on{background:var(--panel2);color:var(--acc)}
.work{grid-area:work;overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0;padding-bottom:20px}
.work>*{flex-shrink:0}
.props{grid-area:props;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 14px 18px}
.vh{display:flex;flex-direction:column;gap:2px}
.vh h1{font:700 23px/1.15 var(--ui);margin:0;text-wrap:balance}
.vh p{margin:0;color:var(--mute);max-width:72ch}
.cvbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:120px}
.cvbox canvas{display:block;width:100%;height:100%}
.h-side{height:clamp(300px,44vh,440px)}
.h-chart{height:250px}
.h-map{height:clamp(380px,64vh,760px)}
.h-sm{height:230px}
.h-polar{height:300px}
.lead{margin:0;max-width:78ch;font-size:15.5px;line-height:1.5}
.lead .btn{margin-left:6px}
.row2b{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px}
.ros{display:flex;flex-wrap:wrap;gap:6px}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;display:flex;flex-direction:column;min-width:0}
.ro span{font:500 12.5px var(--ui);color:var(--mute)}
.ro b{font:600 17px/1.25 var(--ui);font-variant-numeric:tabular-nums}
.ro.ok b{color:var(--ok)}.ro.warn b{color:var(--warn)}.ro.bad b{color:var(--bad)}
.note{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:8px;padding:9px 12px;font-size:14px}
.note.err{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.note p{margin:0}.note p+p{margin-top:4px}
.note .btn{margin-top:8px}
.props section{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.props section:last-child{border-bottom:0}
.props h3{font:600 15px var(--ui);margin:0;color:var(--fg)}
.props .sub{font-size:13px;color:var(--mute);margin:-4px 0 0}
.f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.f label{font-size:14px;color:var(--mute)}
.f .help{grid-column:1/-1;font-size:12.5px;color:var(--dim);line-height:1.35;margin-top:-2px}
.f input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);margin:0;height:22px}
.rw{display:flex;align-items:center;gap:5px}
.rw em{font-style:normal;font:500 13px var(--ui);color:var(--dim);min-width:18px}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:500 14.5px var(--ui);font-variant-numeric:tabular-nums}
input[type=number]{width:78px;text-align:right}
input[type=text]{width:100%}
select{max-width:190px}
.f select{width:172px}
textarea{width:100%;min-height:180px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
input:hover,select:hover{border-color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 13px var(--ui);color:var(--mute);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.tblwrap{overflow-x:auto;margin-inline:-4px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 12.5px var(--ui);color:var(--mute);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:4px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:middle}
.tbl.sm input[type=number]{width:50px;padding:3px 4px;font-size:13px}
.tbl.sm th,.tbl.sm td{padding:4px 3px}
.tbl.sm select{padding:3px 2px;font-size:13px}
.tbl tr.sel td{background:var(--panel2)}
.tbl th:first-child,.tbl td:first-child{padding-left:12px}
.tbl tbody tr[data-id]{cursor:pointer}
.tbl tbody tr[data-id]:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.x{background:transparent;border:0;color:var(--dim);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--panel2)}
.st{display:inline-block;font:600 12px var(--ui);padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.st.mut{background:var(--panel2);color:var(--mute)}
.ps{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:8px}
.ps-h{display:flex;gap:6px;align-items:center}
.ps-h select{flex:1;min-width:0;max-width:none}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mini label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim)}
.mini input,.mini select{width:100%;max-width:none}
.sug{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sug b{color:var(--fg);font-family:var(--ui);font-variant-numeric:tabular-nums}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--mute);font-size:14px}
details.how summary{cursor:pointer;color:var(--fg);font:600 14.5px var(--ui)}
details.how p{margin:8px 0 0;max-width:80ch}
.badge{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--ui);color:var(--mute)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.big{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.big span{display:block;font:500 13px var(--ui);color:var(--mute)}
.big>b{font:700 22px/1.25 var(--ui);font-variant-numeric:tabular-nums}
.big small{display:block;color:var(--dim);font-size:13px}
.big.hl{border-color:var(--acc)}
.big.hl>b{color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font:600 16px var(--ui)}
.card .out{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:7px}
.card .out div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute)}
.card .out b{color:var(--fg);font:600 15px var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:500 13px var(--ui);color:var(--mute)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,14,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(600px,100%);padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 20px var(--ui)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.modal .grid2 label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.modal .grid2 input{width:100%}
.plist{display:flex;flex-direction:column;gap:6px}
.plist div{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.plist span{flex:1;min-width:0}
.plist small{display:block;color:var(--dim)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 10px;font:600 14px var(--ui);color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 16px;border-radius:8px;font:600 14px var(--ui);z-index:60}
.lib-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--mute);padding:20px;text-align:center}
@media (max-width:1180px){.app{grid-template-columns:150px minmax(0,1fr) 300px}}
@media (max-width:960px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto;gap:12px}
  .top{margin-bottom:0}
  .side{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .side h2{display:none}
  .side button{white-space:nowrap;flex:none}
  .work,.props{overflow:visible}
  .row2{grid-template-columns:1fr}
  .tb{margin-left:0}
}
/* celular: barra inferior, controles táctiles, Montaje con el resultado arriba */
.bnav,.tb-menu{display:none}
@media (max-width:760px){
  .tb{display:none}
  .tb-menu{display:inline-flex;margin-left:auto}
  .top{flex-wrap:nowrap;gap:8px}
  .pname{flex:1 1 auto;min-width:0;font-size:15px;padding-inline:4px}
  .side{display:none}
  .bnav{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .bnav button{flex:1;min-width:0;background:transparent;border:0;border-radius:8px;padding:8px 2px;min-height:48px;font:600 14px/1.15 var(--ui);color:var(--mute);cursor:pointer}
  .bnav button.on{color:var(--acc);background:var(--panel2)}
  .app{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .vh p{display:none}
  input[type=number],input[type=text],select{min-height:42px;font-size:16px}
  input[type=number]{width:96px}
  .f select{width:180px}
  .f input[type=range]{height:36px}
  .btn{min-height:44px;padding:10px 14px;font-size:15px}
  .btn.sm{min-height:40px}
  .chip{padding:8px 12px;font-size:14px}
  .x{min-width:40px;min-height:40px}
  body.v-montaje .work{display:contents}
  body.v-montaje .work>*{order:3}
  body.v-montaje .work>.vh,body.v-montaje #warnBox,body.v-montaje #mtRes,body.v-montaje #mtTxt{order:1}
  body.v-montaje .props{order:2}
  #mtRes{grid-template-columns:1fr 1fr}
  #mtRes .big.hl{grid-column:1/-1}
  #mtRes .vel,.lead .l2{display:none}
  #mtRes .big.hl>b{font-size:46px;line-height:1.1}
  .modal .btnrow .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="var(--acc)" stroke-width="2"><path d="M4 3h9"/><path d="M4.3 7.2l8.8 1"/><path d="M5 11.6l8.4 2.2"/><path d="M6.2 16l7.6 3.6"/></g><circle cx="18" cy="11" r="1.6" fill="var(--sub)"/></svg>Tesoro PA</div>

const FILT={BW12:[2,1],BW18:[3,1],BW24:[4,1],LR12:[1,2],LR24:[2,2],LR48:[4,2]};
const FILTNAMES=[['LR24','Linkwitz-Riley 24 dB/oct'],['LR48','Linkwitz-Riley 48 dB/oct'],['LR12','Linkwitz-Riley 12 dB/oct'],['BW12','Butterworth 12 dB/oct'],['BW18','Butterworth 18 dB/oct'],['BW24','Butterworth 24 dB/oct'],['none','Sin filtro']];

function pist(f,size){if(!isNum(size)||size<=0)return 360;const x=0.6*C()/(f*size);return x<1?2*Math.asin(x)/deg:180+180*(1-1/x);}

function prep(md,f){return{k:2*Math.PI*f/C(),w:2*Math.PI*f,air:airDb(f),P:md.groups.map(g=>{const r=grpResp(g,f);return{re:r[0],im:r[1],bwH:Math.max(g.nh||0,pist(f,g.sw)),bwV:Math.max(g.nv||0,pist(f,g.sh))};})};}
function pAt(x,y,z,md,pp){let re=0,im=0;const L=md.src;
 for(let i=0;i<L.length;i++){const s=L[i],P=pp.P[s.g];const dx=x-s.x,dy=y-s.y,dz=z-s.z;
  const fwd=dx*s.sy+dy*s.cy,side=dx*s.cy-dy*s.sy;const rh=Math.sqrt(dx*dx+dy*dy);let r=Math.sqrt(rh*rh+dz*dz);if(r<0.3)r=0.3;
  const th=Math.abs(Math.atan2(side,fwd))/deg;let att=attDb(th,P.bwH);
  if(th<90)att+=attDb(Math.abs(Math.atan2(dz,rh)/deg+s.pd),P.bwV);
  const a=s.amp*s.pol*Math.exp(0.115129*(att-pp.air*r))/r;const ph=-pp.k*r-pp.w*s.delay;const ar=a*Math.cos(ph),ai=a*Math.sin(ph);
  re+=ar*P.re-ai*P.im;im+=ar*P.im+ai*P.re;}

function gridE(md,pts,freqs){const E=new Float32Array(pts.length/3);for(const f of freqs){const pp=prep(md,f);for(let i=0,j=0;i<pts.length;i+=3,j++){const p=pAt(pts[i],pts[i+1],pts[i+2],md,pp);E[j]+=p[0]*p[0]+p[1]*p[1];}}

function genSubs(sb){const c=cab(sb.cab);const w=c&&isNum(c.f.w)?c.f.w:0.6,h=c&&isNum(c.f.h)?c.f.h:0.55;const n=sb.n,L=[],c0=C();

 const groupXs=(cnt)=>{if(sb.loc==='lr'){const l=Math.ceil(cnt/2),r=cnt-l,xs=[];for(const[m,sx]of[[l,-1],[r,1]])for(let i=0;i<m;i++)xs.push(sx*S.la.x+(i-(m-1)/2)*w);return xs;}return Array.from({length:cnt},(_,i)=>(i-(cnt-1)/2)*w);};

  case'lr':{const per=Math.ceil(n/2);for(const sx of[-1,1])for(let k=0;k<per&&L.length<n;k++)add(sx*S.la.x,sb.y,h/2+k*h,0,0,1);break;}
  case'central':{const cols=n<=4?n:Math.ceil(n/2);for(let i=0;i<n;i++){const col=i%cols,row=Math.floor(i/cols);add((col-(cols-1)/2)*w,sb.y,h/2+row*h,0,0,1);}break;}
  case'linea':for(let i=0;i<n;i++)add((i-(n-1)/2)*sb.s,sb.y,h/2,0,0,1);break;
  case'cardioid':{const pairs=Math.max(1,Math.floor(n/2));for(const x of groupXs(pairs)){add(x,sb.y,h/2,0,0,1);add(x,sb.y-sb.dsep,h/2,180,sb.dsep/c0*1000,-1);}break;}
  case'endfire':{const k=Math.max(2,sb.row);const cols=Math.max(1,Math.floor(n/k));for(const x of groupXs(cols))for(let j=0;j<k;j++)add(x,sb.y-j*sb.dsep,h/2,0,(k-1-j)*sb.dsep/c0*1000,1);break;}
  default:return sb.list;}

 const ix=$('#f-map-lp-x'),iy=$('#f-map-lp-y');if(ix)ix.value=S.map.lp.x;if(iy)iy.value=S.map.lp.y;drawMap();drawSpec(buildModel({}));store.set('tpa.cur',S);});

function openModal(h){$('#mbody').innerHTML=h;$('#modal').hidden=false;$('#mbody').querySelector('input,textarea,button')?.focus();}
function closeModal(){const was=!$('#modal').hidden;$('#modal').hidden=true;$('#mbody').innerHTML='';if(was&&(view==='delay'||view==='calc'))renderProps();if(was)schedule();}
function loadProject(d){const cabs=d.cabs||[];cabs.forEach(c=>{if(!cab(c.id))LIB.push(c);});saveLib();const x=clone(d);delete x.cabs;S=merge(DEF(),x);while(S.la.splay.length<5)S.la.splay.push(0);if(!S.subs.list.length&&S.subs.cfg!=='custom')S.subs.list=genSubs(S.subs);store.set('tpa.cur',S);renderAll();}
function openProjects(){const P=Object.values(store.get('tpa.projects',{})).sort((a,b)=>b.saved-a.saved);
 openModal(`<div class="mh"><h2>Abrir proyecto</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
<div class="plist">${P.length?P.map(p=>`<div><span>${esc(p.name)}<small>Guardado ${new Date(p.saved).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}</small></span><button class="btn sm pri" data-act="proj-open" data-id="${p.id}">Abrir</button><button class="btn sm danger" data-act="proj-del" data-id="${p.id}">Borrar</button></div>`).join(''):'<p class="sub">Todavía no guardaste proyectos en este navegador.</p>'}</div>
<h3 style="margin:4px 0 0;font:600 15px var(--ui)">Proyectos de demostración</h3><div class="btnrow"><button class="btn" data-act="demo1">Salón 24 × 35 m</button><button class="btn" data-act="demo2">Exterior 40 × 60 m con torres</button></div>

function report(){const lc=cab(S.la.cab),pc=cab(S.pa.cab),sc=cab(S.subs.cab),m=S.meta,L=[];const fs=S.env.fs;
 L.push(`PROYECTO: ${m.name}`);if(m.event)L.push(`Evento: ${m.event}`);if(m.client)L.push(`Cliente: ${m.client}`);if(m.venue)L.push(`Lugar: ${m.venue}`);if(m.date)L.push(`Fecha: ${m.date}`);
 L.push(`Recinto: ${fmt(S.venue.w,1)} × ${fmt(S.venue.d,1)} m. Público desde ${fmt(S.venue.aud,1)} m. FOH a ${fmt(S.venue.fohY,1)} m. Temperatura ${fmt(S.env.temp,0)} °C (${fmt(C(),1)} m/s).`,'');
 if(S.pa.type==='la')L.push('PA: LINE ARRAY',`${S.la.n} × ${cname(lc)} por lado (${S.la.n*2} en total)`,`Altura de colgado ${fmt(S.la.rigH,2)} m. Inclinación de la primera caja ${fmt(S.la.site,1)}°`,`Ángulos entre cajas: ${S.la.splay.slice(0,S.la.n-1).map(v=>fmt(v,1)+'°').join(', ')||'–'}`,`Separación entre lados ${fmt(S.la.x*2,2)} m`,'');
 else if(S.pa.type==='ps')L.push('PA: CAJAS',`${S.pa.n} × ${cname(pc)} por lado (${S.pa.n*2} en total)`,`Altura del centro ${fmt(S.pa.h,2)} m. Inclinación ${fmt(S.pa.tilt,1)}°`,`Separación entre lados ${fmt(S.la.x*2,2)} m`,'');
 else L.push('Sin PA principal','');
 if(S.subs.on&&S.subs.list.length){L.push('SUBS',`${S.subs.list.length} × ${cname(sc)}. Ubicación: ${CFGS.find(c=>c[0]===S.subs.cfg)[1]}`);S.subs.list.forEach((s,i)=>L.push(`  Sub ${i+1}: x ${fmt(s.x,2)} y ${fmt(s.y,2)} m, ${+s.ang===180?'mirando atrás':'mirando al frente'}, delay propio ${fmt(s.delay,2)} ms, polaridad ${+s.pol===1?'+':'−'}`));
  {const gg=S.pa.type!=='none'?geoAt(refPoint()):null;if(S.mt.route==='chain'&&gg&&isNum(gg.ms)){const kk=knobFor(gg.ms,S.xo.fc);L.push('',`ALINEACIÓN PA + SUBS, medida en ${refPoint().n}`,`Señal en cadena. Perilla de fase del sub en ${kk.k}° con corte en ${S.xo.fc} Hz (equivale a ${fmt(gg.ms,2)} ms)`,'');}else L.push('',`ALINEACIÓN PA + SUBS, medida en ${refPoint().n}`,`Delay subs ${fmt(S.xo.subDelay,2)} ms (${Math.round(S.xo.subDelay*fs/1000)} muestras). Delay tops ${fmt(S.xo.topDelay,2)} ms (${Math.round(S.xo.topDelay*fs/1000)} muestras)`,`Polaridad subs ${S.xo.subPol===1?'normal':'invertida'}. Cruce ${S.xo.fc} Hz`,'');}}
 if(S.ps.length){L.push(`CAJAS DISTRIBUIDAS (alineadas con ${S.dist.ref==='first'||S.pa.type==='none'?'la primera fila de cajas':'el PA'}, adelanto ${fmt(S.dist.offset,1)} ms)`);S.ps.forEach((p,i)=>L.push(`  ${i+1}. ${p.role}, ${cname(cab(p.cab))}: a ${fmt(p.y,1)} m, lateral ${fmt(p.x,1)} m, altura ${fmt(p.z,1)} m. Delay ${fmt(p.delay,2)} ms (${Math.round(p.delay*fs/1000)} muestras)`));L.push('');}
 const cnt={};const addc=(c,n)=>{if(!c)return;cnt[cname(c)]=(cnt[cname(c)]||0)+n;};if(S.pa.type==='la')addc(lc,S.la.n*2);if(S.pa.type==='ps')addc(pc,S.pa.n*2);if(S.subs.on)addc(sc,S.subs.list.length);S.ps.forEach(p=>addc(cab(p.cab),1));
 L.push('LISTADO DE EQUIPOS',...Object.entries(cnt).map(([k,v])=>`  ${v} × ${k}`),'');
 L.push('Delays calculados por distancia. Verificar y ajustar midiendo en el lugar.');return L.join('\n');}
function openExport(tab){openModal(`<div class="mh"><h2>Exportar</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>

<h3 style="margin:0;font:600 15px var(--ui)">Datos del evento</h3><div class="grid2">${tx('Evento','meta.event')}${tx('Cliente','meta.client')}${tx('Lugar','meta.venue')}${tx('Fecha','meta.date')}</div>

<label>Frecuencia de muestreo<select data-p="env.fs" data-num>${[44100,48000,96000].map(v=>`<option value="${v}"${v===S.env.fs?' selected':''}>${v/1000} kHz</option>`).join('')}</select></label></div>
<p class="sub">El headroom baja la potencia de cada caja respecto de su RMS. Con 6 dB, la predicción usa un cuarto de la potencia nominal.</p><div class="btnrow"><button class="btn pri" data-act="close">Listo</button></div>`);}
function openHelp(){store.set('tpa.seen',1);openModal(`<div class="mh"><h2>Cómo se usa</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
<ol><li>En Montaje cargá el recinto, el PA (line array o cajas) y dónde van los subs. Arriba aparece el delay para arrancar y dónde cargarlo.</li>
<li>Si tenés cajas repartidas por el lugar, agregalas en Cajas distribuidas y cada una recibe su delay.</li>
<li>En Mapa de cobertura ves cómo queda el sonido en el público. Para eso cada caja necesita sus datos completos en la Biblioteca. Tus modelos ya están creados para que les cargues la ficha.</li>
<li>Avanzado es para afinar: ángulos del line array, configuraciones de subs y curvas de fase.</li>
<li>Guardá el proyecto y copiá el informe desde Exportar.</li></ol>
<p class="sub">Los delays salen de las distancias, así que funcionan aunque falten datos de las cajas. Son un punto de partida: después se ajusta midiendo.</p>
<div class="btnrow"><button class="btn pri" data-act="close">Empezar</button></div>`);}
